name: Bug report
description: Report something that is broken or incorrect
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Please include enough detail to reproduce the issue.

  - type: textarea
    id: description
    attributes:
      label: Description
      description: What went wrong?
      placeholder: A clear description of the bug.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Minimal steps or code snippet to trigger the issue.
      placeholder: |
        1. ...
        2. ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen instead?
    validations:
      required: true

  - type: input
    id: python-version
    attributes:
      label: Python version
      description: e.g. 3.12.4
      placeholder: "3.12"
    validations:
      required: true

  - type: input
    id: package-version
    attributes:
      label: cloudy-salesforce version
      description: Output of `pip show cloudy-salesforce` or git commit if installed from source.
      placeholder: "0.1.0"
    validations:
      required: true
